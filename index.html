<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biccas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header_page">
      <div class="header_wrapper">
        <h2 class="header_logo">Biccas</h2>
        <div class="header_nav">
          <a href="#Home">Home</a>
          <a href="#Product">Product</a>
          <a href="#FAQ">FAQ</a>
          <a href="#Blog">Blog</a>
          <a href="#AboutUs">About Us</a>
        </div>
        <div class="header_auth">
          <button class="header_auth_login">Login</button>
          <button class="header_auth_signup">Sign Up</button>
        </div>
      </div>
    </header>
    <main class="main_content">
      <section class="hero">
        <div class="hero_wrapper">
          <div class="hero_about">
            <div class="hero_about_text">
              <h1>We’re here to Increase your Productivity</h1>
              <img src="./assets/images/hero_curve.svg" alt="" />
            </div>

            <p>
              Let's make your work more organize and easily using the Taskio
              Dashboard with many of the latest featuresin managing work every
              day.
            </p>

            <div class="hero_actions">
              <button class="hero_actions_trial">Try free trial</button>
              <button class="hero_actions_demo">
                <i class="ph ph-play-circle"></i> View Demo
              </button>
            </div>
          </div>
          <div class="hero_illustration">
            <img src="./assets/images/hero_illustration.png" alt="" />
          </div>
        </div>

        <footer class="hero_partners">
          <h2>More than 25,000 teams use Collabs</h2>
          <ul class="hero_partners_list">
            <li>
              <img src="./assets/images/Unsplash.png" alt="Unsplash" />
            </li>
            <li>
              <img src="./assets/images/Notion.png" alt="Unsplash" />
            </li>
            <li>
              <img src="./assets/images/Intercom.png" alt="Intercom" />
            </li>
            <li>
              <img src="./assets/images/Descript.png" alt="Descript" />
            </li>
            <li>
              <img src="./assets/images/Grammarly.png" alt="Grammarly" />
            </li>
          </ul>
        </footer>
      </section>
    </main>
  </body>
</html>
